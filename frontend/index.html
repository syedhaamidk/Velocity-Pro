<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Velocity Pro | Live Sports Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{ extend:{ colors:{
        "bg":"#0c0e10","bg1":"#111416","bg2":"#161a1e","bg3":"#1b2025","bg4":"#20262c",
        "pri":"#abcbda","pri-dim":"#9ebecc","pri-con":"#2c4b57",
        "sec":"#979fa5","on-s":"#e0e6ed","on-sv":"#a6acb3",
        "out":"#70767d","out-v":"#42494f",
        "err":"#ee7d77","live":"#f87171","win":"#4ade80","loss":"#f87171",
        "nba-c":"#f97316","ipl-c":"#22c55e","ucl-c":"#818cf8","epl-c":"#38bdf8","nhl-c":"#22d3ee","nfl-c":"#dc2626",
      }, fontFamily:{ "headline":["Manrope","sans-serif"],"body":["Inter","sans-serif"],"mono":["JetBrains Mono","monospace"] } } }
    }
  </script>
  <style>
    *{box-sizing:border-box}
    body{background:#0c0e10;color:#e0e6ed;font-family:'Inter',sans-serif;overflow-x:hidden}
    .msym{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;font-size:20px;line-height:1;vertical-align:middle}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:#0c0e10}
    ::-webkit-scrollbar-thumb{background:#20262c;border-radius:2px}
    ::-webkit-scrollbar-thumb:hover{background:#abcbda}
    .fade-in{animation:fadeIn .35s ease forwards}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .toast-in{animation:toastIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
    .spin{animation:spinR 1s linear infinite}
    @keyframes spinR{to{transform:rotate(360deg)}}
    .live-glow{box-shadow:0 0 0 0 rgba(248,113,113,.7);animation:liveGlowA 1.5s infinite}
    @keyframes liveGlowA{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}70%{box-shadow:0 0 0 6px rgba(248,113,113,0)}}
    .skeleton{background:linear-gradient(90deg,#161a1e 25%,#1b2025 50%,#161a1e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .card-lift{transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s,background-color .2s,box-shadow .3s}
    .card-lift:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
    .btn-press{transition:transform .1s ease;cursor:pointer}
    .btn-press:active{transform:scale(.95)}
    .ring-rotate{transform:rotate(-90deg);transform-origin:50% 50%}
    .modal-bg{animation:modalFadeIn .2s ease}
    @keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{animation:modalSlideUp .25s cubic-bezier(.34,1.56,.64,1)}
    @keyframes modalSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .cric-row:hover,.box-row:hover,.play-row:hover{background:rgba(171,203,218,.04)}
    th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#70767d;font-weight:500;padding:6px 10px;border-bottom:1px solid rgba(66,73,79,.3);text-align:center}
    th:first-child{text-align:left;min-width:140px}
    td{padding:7px 10px;border-bottom:1px solid rgba(66,73,79,.12);text-align:center;font-size:12px;color:#a6acb3;font-family:'JetBrains Mono',monospace}
    td:first-child{text-align:left;font-family:'Inter',sans-serif;color:#e0e6ed;font-size:13px}
    .hi{color:#abcbda !important;font-weight:600}
    .dim{color:#42494f !important}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API_BASE = (() => {
  const { hostname } = window.location;
  if (hostname === 'localhost' || hostname === '127.0.0.1') return 'http://localhost:3001/api';
  return '/api';
})();
const WS_URL = API_BASE.replace('/api','') || window.location.origin;
const REFRESH_SECS = 90;
const LEAGUES = ['All','NBA','EPL','UCL','IPL','NHL','T20','Serie A','Bundesliga','Ligue 1'];
const LC = { NBA:'#f97316',IPL:'#22c55e',UCL:'#818cf8',EPL:'#38bdf8',NHL:'#22d3ee',NFL:'#dc2626',T20:'#22c55e','Serie A':'#facc15',Bundesliga:'#f97316','Ligue 1':'#f43f5e' };

function sportOf(match) {
  if (match.sport) return match.sport;
  if (match.league === 'NBA') return 'basketball';
  if (match.league === 'NHL') return 'hockey';
  if (match.league === 'IPL') return 'cricket';
  return 'football';
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  }) + ' IST';
}

/* ─── TOAST ─── */
let _setToasts = null;
function toast(msg, type='info', dur=4000) {
  if (!_setToasts) return;
  const id = Date.now();
  _setToasts(p=>[...p,{id,msg,type}]);
  setTimeout(()=>_setToasts(p=>p.filter(t=>t.id!==id)),dur);
}
function ToastContainer() {
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{_setToasts=setToasts;return()=>{_setToasts=null};},[]);
  const ic={info:'info',success:'check_circle',error:'error',live:'bolt'};
  const cl={info:'#abcbda',success:'#4ade80',error:'#f87171',live:'#facc15'};
  return <div className="fixed top-20 right-4 z-[300] flex flex-col gap-2 pointer-events-none">
    {toasts.map(t=>(
      <div key={t.id} className="toast-in flex items-center gap-3 bg-[#1b2025] border border-[#42494f]/30 rounded-lg px-4 py-3 shadow-2xl min-w-[240px] max-w-[320px]">
        <span className="material-symbols-outlined flex-shrink-0" style={{fontSize:16,color:cl[t.type]}}>{ic[t.type]}</span>
        <span className="text-xs text-[#e0e6ed] leading-snug flex-1">{t.msg}</span>
      </div>
    ))}
  </div>;
}

/* ─── ATOMS ─── */
function Badge({league}){
  const c=LC[league]||'#abcbda';
  return <span className="text-[9px] font-mono uppercase tracking-widest px-2 py-0.5 rounded border" style={{color:c,borderColor:`${c}40`,background:`${c}15`}}>{league}</span>;
}
function Avatar({name='',logo='',size='md',winner}){
  const [err,setErr]=useState(false);
  const sz={sm:'w-8 h-8 text-[9px]',md:'w-11 h-11 text-[10px]',lg:'w-14 h-14 text-xs'}[size];
  const ini=name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  if (logo&&!err) return <img src={logo} alt={name} onError={()=>setErr(true)} className={`${sz} rounded-full object-contain bg-[#1b2025] border ${winner?'border-[#abcbda]/60':'border-[#42494f]/30'} p-1`}/>;
  return <div className={`${sz} rounded-full bg-[#1b2025] border flex items-center justify-center font-mono font-bold flex-shrink-0 ${winner?'border-[#abcbda]/60 text-[#abcbda]':'border-[#42494f]/30 text-[#a6acb3]'}`}>{ini}</div>;
}
function Skeleton(){
  return <div className="bg-[#111416] rounded-lg p-6 border border-[#42494f]/10 mb-3">
    <div className="flex justify-between mb-5"><div className="skeleton h-3 w-40 rounded"/><div className="skeleton h-3 w-16 rounded"/></div>
    <div className="grid grid-cols-3 gap-2">
      <div className="flex flex-col gap-2"><div className="skeleton w-11 h-11 rounded-full"/><div className="skeleton h-4 w-20 rounded"/></div>
      <div className="flex items-center justify-center"><div className="skeleton h-8 w-24 rounded"/></div>
      <div className="flex flex-col items-end gap-2"><div className="skeleton w-11 h-11 rounded-full"/><div className="skeleton h-4 w-20 rounded"/></div>
    </div>
  </div>;
}
function RefreshBtn({countdown,loading,onRefresh}){
  const r=10,circ=2*Math.PI*r,pct=countdown/REFRESH_SECS;
  return <button onClick={onRefresh} disabled={loading} className="flex items-center gap-2 px-4 py-2 bg-[#161a1e] border border-[#42494f]/20 rounded-lg text-xs uppercase tracking-widest text-[#a6acb3] hover:border-[#abcbda]/30 hover:text-[#abcbda] transition-all btn-press disabled:opacity-40">
    <div className="relative w-5 h-5 flex-shrink-0">
      <svg className="w-5 h-5 ring-rotate" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r={r} fill="none" stroke="#42494f" strokeWidth="1.5"/>
        <circle cx="12" cy="12" r={r} fill="none" stroke="#abcbda" strokeWidth="1.5" strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" style={{transition:'stroke-dashoffset 1s linear'}}/>
      </svg>
      {!loading&&<span className="absolute inset-0 flex items-center justify-center text-[7px] font-mono text-[#abcbda]">{countdown}</span>}
      {loading&&<span className="material-symbols-outlined text-[#abcbda] spin absolute inset-0 flex items-center justify-center" style={{fontSize:12}}>refresh</span>}
    </div>
    <span className={loading?'animate-pulse':''}>{loading?'Syncing…':'Refresh'}</span>
  </button>;
}

/* ─── SCORECARD MODAL ─── */
function ScorecardModal({match,onClose}){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState(null);

  useEffect(()=>{
    if (!match) return;
    setLoading(true); setErr(null); setData(null);
    const sport=sportOf(match);
    const meta=match.external_meta||{};
    let url='';

    if (sport==='basketball') {
      const rawId=(match.external_id||'').split('_').pop();
      url=`${API_BASE}/scorecard/nba/${rawId}`;
    } else if (sport==='hockey') {
      const rawId=(match.external_id||'').split('_').pop();
      url=`${API_BASE}/scorecard/nhl/${rawId}`;
    } else if (sport==='cricket') {
      const cid=meta.cricApiId||(match.external_id||'').replace('cric_match_','');
      url=`${API_BASE}/scorecard/cricket/${cid}`;
    } else {
      const rawId=(match.external_id||'').split('_').pop();
      const lg=(match.league==='UCL')?'ucl':'epl';
      url=`${API_BASE}/scorecard/soccer/${rawId}?league=${lg}`;
    }

    fetch(url).then(r=>r.json()).then(d=>{
      if (d.success) setData(d.data);
      else setErr(d.error||'Failed to load scorecard');
    }).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
  },[match]);

  if (!match) return null;
  const sport=sportOf(match);
  const homeWin=match.winner_team===match.home_team;
  const awayWin=match.winner_team===match.away_team;
  const meta=match.external_meta||{};
  const isScheduled=match.status==='scheduled';

  return <div className="modal-bg fixed inset-0 bg-black/70 backdrop-blur-sm z-[200] flex items-start justify-center p-4 overflow-y-auto" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-box w-full max-w-4xl bg-[#111416] border border-[#42494f]/30 rounded-2xl my-8 relative">
      <div className="flex items-start justify-between p-6 border-b border-[#42494f]/15">
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <Badge league={match.league}/>
            <span className={`text-[10px] font-mono uppercase tracking-widest ${match.status==='live'?'text-red-400':isScheduled?'text-yellow-400':'text-[#70767d]'}`}>
              {match.status==='live'?'● LIVE':isScheduled?'UPCOMING':sport==='football'||sport==='soccer'?'FT':'FINAL'}
            </span>
            {match.venue&&<span className="text-[10px] text-[#42494f] font-mono">{match.venue}</span>}
          </div>
          <h2 className="font-headline text-2xl font-light tracking-tight" style={{fontFamily:'Manrope'}}>
            <span className={homeWin?'text-[#abcbda]':'text-[#e0e6ed]'}>{match.home_team}</span>
            <span className="text-[#42494f] mx-3 font-extralight">vs</span>
            <span className={awayWin?'text-[#abcbda]':'text-[#e0e6ed]'}>{match.away_team}</span>
          </h2>
          {!isScheduled&&match.home_score!=null&&<div className="mt-1 font-headline text-4xl font-extralight tracking-tighter">
            <span className={homeWin?'text-[#abcbda]':''}>{match.home_score}</span>
            <span className="text-[#42494f] mx-2">—</span>
            <span className={awayWin?'text-[#abcbda]':''}>{match.away_score}</span>
          </div>}
          {isScheduled&&match.match_date&&<div className="mt-1 text-sm text-[#70767d] font-mono">{fmtDate(match.match_date)}</div>}
          {sport==='cricket'&&meta&&<div className="mt-1 font-mono text-sm text-[#a6acb3]">
            {meta.inn1&&<div>{match.home_team}: {meta.inn1}</div>}
            {meta.inn2&&<div>{match.away_team}: {meta.inn2}</div>}
            {meta.result&&<div className="text-[#4ade80] text-xs mt-1">{meta.result}</div>}
          </div>}
        </div>
        <button onClick={onClose} className="p-2 hover:bg-[#20262c] rounded-full transition-colors btn-press flex-shrink-0">
          <span className="material-symbols-outlined text-[#a6acb3]" style={{fontSize:18}}>close</span>
        </button>
      </div>
      <div className="p-6">
        {isScheduled&&<div className="text-center py-8 text-[#a6acb3]">
          <span className="material-symbols-outlined block opacity-30 mb-3" style={{fontSize:48}}>schedule</span>
          <p className="text-sm">Match hasn't started yet</p>
          <p className="text-xs text-[#42494f] mt-1">{fmtDate(match.match_date)}</p>
        </div>}
        {!isScheduled&&<>
          {loading&&<div className="flex items-center justify-center gap-3 py-12">
            <div className="spin w-6 h-6 border-2 border-[#42494f] border-t-[#abcbda] rounded-full"/>
            <span className="text-[#a6acb3] text-sm">Fetching live scorecard…</span>
          </div>}
          {err&&<div className="bg-[#ee7d77]/10 border border-[#ee7d77]/20 rounded-lg p-4 text-sm text-[#ee7d77]">
            {err}
            {sport==='cricket'&&<div className="mt-2 text-[#a6acb3] text-xs">Add your free key at cricketdata.org → <code className="text-[#abcbda]">.env: CRICAPI_KEY=yourkey</code> → restart backend</div>}
          </div>}
          {data&&!loading&&<>
            {sport==='basketball'&&<NBAScorecard data={data}/>}
            {sport==='hockey'&&<NHLScorecard data={data}/>}
            {(sport==='football'||sport==='soccer')&&<SoccerScorecard data={data} home={match.home_team} away={match.away_team}/>}
            {sport==='cricket'&&<CricketScorecard data={data}/>}
          </>}
        </>}
      </div>
    </div>
  </div>;
}

function TabRow({tabs,active,onChange}){
  return <div className="flex gap-1 mb-4 border-b border-[#42494f]/15 overflow-x-auto">
    {tabs.map(([id,label])=>(
      <button key={id} onClick={()=>onChange(id)} className={`px-4 py-2 text-[11px] uppercase tracking-widest font-mono whitespace-nowrap transition-all btn-press border-b-2 -mb-px ${active===id?'border-[#abcbda] text-[#abcbda]':'border-transparent text-[#70767d] hover:text-[#a6acb3]'}`}>{label}</button>
    ))}
  </div>;
}

/* ─── NBA SCORECARD ─── */
function NBAScorecard({data}){
  const [tab,setTab]=useState('box');
  const {quarters=[],players=[],teamStats=[],plays=[],leaders=[]}=data;
  return <>
    <TabRow tabs={[['box','Box Score'],['plays','Play-by-Play'],['stats','Team Stats']]} active={tab} onChange={setTab}/>
    {tab==='box'&&<>
      {quarters.length>0&&<div className="mb-5 overflow-x-auto">
        <table className="w-full border-collapse">
          <thead><tr><th className="text-left">Team</th>{quarters[0]?.linescores?.map((_,i)=><th key={i}>Q{i+1}</th>)}<th>T</th></tr></thead>
          <tbody>{quarters.map((t,i)=><tr key={i}><td className="font-mono text-xs font-bold" style={{color:'#abcbda'}}>{t.team}</td>{t.linescores.map((s,j)=><td key={j}>{s||0}</td>)}<td className="hi">{t.total}</td></tr>)}</tbody>
        </table>
      </div>}
      {players.map((team,ti)=>(
        <div key={ti} className="mb-6">
          <div className="text-[10px] font-mono font-bold uppercase tracking-widest text-[#abcbda] mb-2">{team.team} — Players</div>
          <div className="overflow-x-auto">
            <table className="w-full border-collapse">
              <thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG</th><th>3PT</th><th>FT</th><th>+/-</th></tr></thead>
              <tbody>{team.athletes.map((a,ai)=>(
                <tr key={ai} className="box-row">
                  {a.dnp?<><td>{a.name}</td><td colSpan={10} className="text-center dim text-[11px] italic">DNP</td></>
                  :<><td>{a.name}{a.starter&&<sup className="text-[#abcbda] ml-0.5">●</sup>}</td>
                    <td>{a.stats.min}</td><td className="hi">{a.stats.pts}</td><td>{a.stats.reb}</td>
                    <td>{a.stats.ast}</td><td>{a.stats.stl}</td><td>{a.stats.blk}</td>
                    <td>{a.stats.fgm}</td><td>{a.stats.threepm}</td><td>{a.stats.ftm}</td>
                    <td className={parseInt(a.stats.pm)>0?'text-[#4ade80]':parseInt(a.stats.pm)<0?'text-[#f87171]':''}>{a.stats.pm}</td></>}
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      ))}
    </>}
    {tab==='plays'&&<div className="max-h-[480px] overflow-y-auto">
      <table className="w-full border-collapse">
        <thead><tr><th>Qtr</th><th>Clock</th><th className="text-left" style={{minWidth:280}}>Play</th><th>Score</th></tr></thead>
        <tbody>{plays.map((p,i)=><tr key={i} className={`play-row ${p.isScoring?'bg-[#abcbda]/5':''}`}>
          <td className="dim">Q{p.period}</td><td className="font-mono text-[11px]">{p.clock}</td>
          <td className={`text-left text-xs ${p.isScoring?'text-[#abcbda] font-medium':'text-[#a6acb3]'}`} style={{textAlign:'left'}}>{p.text}</td>
          <td className="font-mono text-[11px]">{p.homeScore!=null?`${p.homeScore}-${p.awayScore}`:''}</td>
        </tr>)}</tbody>
      </table>
      {plays.length===0&&<div className="text-center text-[#a6acb3] py-8 text-sm">Play-by-play not yet available</div>}
    </div>}
    {tab==='stats'&&<div className="grid grid-cols-1 md:grid-cols-2 gap-3">
      {teamStats.map((t,i)=><div key={i} className="bg-[#161a1e] rounded-lg p-4">
        <div className="text-[10px] font-mono font-bold uppercase tracking-widest text-[#abcbda] mb-3">{t.team}</div>
        {Object.entries(t.stats).map(([k,v])=><div key={k} className="flex justify-between py-1.5 border-b border-[#42494f]/15 text-xs">
          <span className="text-[#70767d] uppercase tracking-wider text-[10px]">{k.replace(/([A-Z])/g,' $1').trim()}</span>
          <span className="font-mono text-[#e0e6ed]">{v}</span>
        </div>)}
      </div>)}
    </div>}
  </>;
}

/* ─── NHL SCORECARD ─── */
function NHLScorecard({data}){
  const [tab,setTab]=useState('goals');
  const {periods=[],home={},away={},goals=[],shotsByPeriod=[]}=data;
  return <>
    {periods.length>0&&<div className="mb-5 overflow-x-auto">
      <table className="w-full border-collapse">
        <thead><tr><th className="text-left">Team</th>{periods.map(p=><th key={p.label}>{p.label}</th>)}<th>T</th></tr></thead>
        <tbody>
          <tr><td className="font-bold text-[#abcbda] font-mono text-xs">{home.abbrev}</td>{periods.map((p,i)=><td key={i}>{p.home}</td>)}<td className="hi">{home.score}</td></tr>
          <tr><td className="font-bold text-[#abcbda] font-mono text-xs">{away.abbrev}</td>{periods.map((p,i)=><td key={i}>{p.away}</td>)}<td className="hi">{away.score}</td></tr>
        </tbody>
      </table>
    </div>}
    <TabRow tabs={[['goals','Goals'],['home','Home Skaters'],['away','Away Skaters'],['shots','Shots']]} active={tab} onChange={setTab}/>
    {tab==='goals'&&<div>
      {goals.length===0&&<div className="text-center text-[#a6acb3] py-8 text-sm">No goals data available</div>}
      {goals.map((g,i)=><div key={i} className="flex items-start gap-4 p-3 border-b border-[#42494f]/12 hover:bg-[#161a1e] rounded">
        <span className="font-mono text-xs text-[#abcbda] min-w-[60px]">P{g.period} {g.time}</span>
        <span className={`text-[10px] font-mono font-bold uppercase tracking-wider min-w-[32px] ${g.isHome?'text-[#38bdf8]':'text-[#f97316]'}`}>{g.isHome?(home.abbrev||'HOME'):(away.abbrev||'AWAY')}</span>
        <div className="flex-1">
          <div className="text-sm font-medium text-[#e0e6ed]">{g.scorer} <span className="text-[#70767d] text-xs">({g.type})</span></div>
          {(g.assist1||g.assist2)&&<div className="text-xs text-[#a6acb3] mt-0.5">Assists: {[g.assist1,g.assist2].filter(Boolean).join(', ')}</div>}
        </div>

/* ─── MAIN APP ─── */
function App(){
  const [tab,setTab]=useState('scores');
  const [league,setLeague]=useState('All');
  const [sidebar,setSidebar]=useState(false);
  const [countdown,setCountdown]=useState(REFRESH_SECS);
  const [loading,setLoading]=useState(true);
  const [lastSync,setLastSync]=useState(new Date());
  const [backendOK,setBackendOK]=useState(false);
  const [wsConn,setWsConn]=useState(false);
  const [scores,setScores]=useState([]);
  const [upcoming,setUpcoming]=useState([]);
  const [liveN,setLiveN]=useState(0);
  const [modal,setModal]=useState(null);
  const socketRef=useRef(null);

  const fetchScores=useCallback(async()=>{
    try {
      const r=await fetch(`${API_BASE}/scores?league=${league}&limit=100`);
      if (!r.ok) throw new Error(r.status);
      const d=await r.json();
      if (d.success){ setScores(d.data); setLiveN(d.data.filter(m=>m.status==='live').length); }
      setBackendOK(true);
    } catch(e){ setBackendOK(false); toast('Backend offline — start with npm start','error',5000); }
  },[league]);

  const fetchUpcoming=useCallback(async()=>{
    try {
      const r=await fetch(`${API_BASE}/upcoming?league=${league}&limit=60`);
      if (!r.ok) throw new Error(r.status);
      const d=await r.json();
      if (d.success) setUpcoming(d.data);
    } catch {}
  },[league]);

  const doRefresh=useCallback(async(showToast=true)=>{
    setLoading(true);
    fetch(`${API_BASE}/sync`,{method:'POST'}).catch(()=>{});
    await Promise.all([fetchScores(),fetchUpcoming()]);
    setLastSync(new Date());
    setLoading(false);
    if (showToast) toast('Data refreshed','success',2500);
  },[fetchScores,fetchUpcoming]);

  useEffect(()=>{
    fetch(`${API_BASE}/health`,{signal:AbortSignal.timeout(3000)}).then(r=>{if(r.ok)setBackendOK(true);}).catch(()=>{});
    doRefresh(false);
  },[]);

  useEffect(()=>{ if(tab==='scores') fetchScores(); else fetchUpcoming(); },[league,tab]);

  useEffect(()=>{
    try {
      const s=io(WS_URL,{transports:['websocket','polling'],timeout:5000});
      socketRef.current=s;
      s.on('connect',()=>{setWsConn(true);toast('Real-time connected','success',3000);});
      s.on('disconnect',()=>setWsConn(false));
      s.on('match_update',()=>{setLastSync(new Date());fetchScores();fetchUpcoming();toast('Live data updated','live',3000);});
      return ()=>s.disconnect();
    } catch {}
  },[]);

  useEffect(()=>{
    const t=setInterval(()=>setCountdown(p=>{
      if(p<=1){doRefresh(false);return REFRESH_SECS;}
      return p-1;
    }),1000);
    return ()=>clearInterval(t);
  },[doRefresh]);

  const TABS=[{id:'scores',label:'Scores',icon:'leaderboard'},{id:'upcoming',label:'Upcoming',icon:'event_note'},{id:'schema',label:'Schema',icon:'account_tree'},{id:'deploy',label:'Deploy',icon:'rocket_launch'}];

  return <div className="min-h-screen bg-[#0c0e10] text-[#e0e6ed]">
    <ToastContainer/>
    {modal&&<ScorecardModal match={modal} onClose={()=>setModal(null)}/>}

    <header className="bg-[#0c0e10]/90 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#42494f]/10">
      <div className="flex justify-between items-center px-5 py-3.5 max-w-7xl mx-auto">
        <div className="flex items-center gap-4">
          <button className="p-2 -ml-2 hover:bg-[#20262c] rounded-lg transition-colors btn-press" onClick={()=>setSidebar(true)}>
            <span className="material-symbols-outlined text-[#abcbda]">menu</span>
          </button>
          <div className="flex items-center gap-3">
            <span className="material-symbols-outlined text-[#abcbda]">signal_cellular_alt</span>
            <span className="text-lg font-light tracking-[.2em] text-[#abcbda] hidden sm:inline" style={{fontFamily:'Manrope'}}>VELOCITY PRO</span>
          </div>
        </div>
        <nav className="hidden md:flex items-center gap-1">
          {TABS.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setLeague('All');}} className={`px-4 py-2 text-xs uppercase tracking-widest transition-all rounded btn-press ${tab===t.id?'text-[#abcbda] bg-[#abcbda]/10 border border-[#abcbda]/20':'text-[#979fa5] hover:text-[#e0e6ed] hover:bg-[#20262c]/60'}`}>{t.label}</button>)}
        </nav>
        <div className="flex items-center gap-3">
          <div className="hidden sm:flex items-center gap-2">
            <StatusPill ok={backendOK} label={backendOK?'API':'offline'}/>
            <StatusPill ok={wsConn} label={wsConn?'live':'poll'} color="blue"/>
            {liveN>0&&<div className="flex items-center gap-1.5 px-2 py-1 bg-red-500/10 rounded border border-red-500/20">
              <span className="w-1.5 h-1.5 rounded-full bg-red-400 live-glow"/><span className="text-[9px] font-mono text-red-400 uppercase tracking-widest">{liveN} live</span>
            </div>}
          </div>
          <RefreshBtn countdown={countdown} loading={loading} onRefresh={()=>{setCountdown(REFRESH_SECS);doRefresh(true);}}/>
          <div className="w-8 h-8 rounded-full bg-[#abcbda]/20 border border-[#abcbda]/20 flex items-center justify-center text-[10px] font-bold text-[#abcbda]">VP</div>
        </div>
      </div>
    </header>

    <main className="pt-20 pb-32 px-5 md:px-10 lg:px-16 max-w-6xl mx-auto">
      <div className="flex flex-col md:flex-row md:items-end justify-between mt-8 mb-7 gap-4">
        <div>
          <div className="flex items-center gap-3 mb-2 flex-wrap">
            <span className="bg-[#abcbda]/10 text-[#abcbda] text-[10px] font-mono px-2 py-0.5 rounded border border-[#abcbda]/20 uppercase tracking-widest">Live Dashboard</span>
            <span className="text-[#a6acb3] text-[10px] font-mono opacity-50">Synced {lastSync.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
            {!backendOK&&<span className="text-[9px] text-yellow-400/70 border border-yellow-500/20 bg-yellow-500/5 px-2 py-0.5 rounded font-mono">⚠ backend offline</span>}
          </div>
          <h1 className="font-headline text-3xl md:text-4xl font-extralight tracking-tight" style={{fontFamily:'Manrope'}}>
            {tab==='scores'&&'Match Results'}{tab==='upcoming'&&'Upcoming Fixtures'}
            {tab==='schema'&&<span>Architecture <span className="text-[#abcbda]/50 font-mono text-xl ml-3">v4.1</span></span>}
            {tab==='deploy'&&'Go Live Guide'}
          </h1>
        </div>
        {(tab==='scores'||tab==='upcoming')&&<div className="flex gap-2 flex-wrap">
          {LEAGUES.map(l=><button key={l} onClick={()=>setLeague(l)} className={`px-4 py-1.5 rounded-full border text-xs tracking-wider transition-all btn-press ${l===league?'border-[#abcbda] bg-[#abcbda]/10 text-[#abcbda]':'border-[#42494f]/30 text-[#979fa5] hover:border-[#abcbda]/40 hover:text-[#e0e6ed]'}`}>{l}</button>)}
        </div>}
      </div>

      <div key={tab+league} className="fade-in">
        {tab==='scores'&&<>
          {!backendOK&&<div className="bg-yellow-500/8 border border-yellow-500/20 rounded-lg p-4 mb-5 text-sm text-yellow-400/80">
            <strong>Backend offline.</strong> Start it with <code className="text-yellow-300 bg-yellow-900/30 px-1 rounded">cd backend &amp;&amp; npm start</code>, then refresh.
          </div>}
          {loading?[1,2,3].map(i=><Skeleton key={i}/>)
            :scores.length===0?<EmptyState label={`No matches found${league!=='All'?` for ${league}`:''}`}/>
            :<div className="space-y-3">{scores.map((m,i)=><MatchCard key={m.id} match={m} idx={i} onOpen={setModal}/>)}</div>}
        </>}
        {tab==='upcoming'&&<>
          {upcoming.length===0&&!loading&&<EmptyState label="No upcoming fixtures synced yet."/>}
          <div className="space-y-2">{upcoming.map((f,i)=><FixtureRow key={f.id} f={f} idx={i}/>)}</div>
        </>}
        {tab==='schema'&&<SchemaTab/>}
        {tab==='deploy'&&<DeployGuide/>}
      </div>
    </main>

    {sidebar&&<>
      <div className="fixed inset-0 bg-black/60 z-[60]" onClick={()=>setSidebar(false)}/>
      <aside className="fixed top-0 left-0 h-full w-68 bg-[#111416] border-r border-[#42494f]/10 z-[70] flex flex-col">
        <div className="p-5 border-b border-[#42494f]/10 flex items-center justify-between">
          <span className="text-sm font-light tracking-[.2em] text-[#abcbda]" style={{fontFamily:'Manrope'}}>VELOCITY PRO</span>
          <button className="p-2 hover:bg-[#20262c] rounded-full btn-press" onClick={()=>setSidebar(false)}><span className="material-symbols-outlined text-[#a6acb3]" style={{fontSize:18}}>close</span></button>
        </div>
        <nav className="flex-1 px-4 py-4 space-y-1">
          {TABS.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setLeague('All');setSidebar(false);}} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all btn-press ${tab===t.id?'bg-[#abcbda]/10 text-[#abcbda] border-l-2 border-[#abcbda]':'text-[#a6acb3] hover:bg-[#20262c]/40 hover:text-[#e0e6ed]'}`}>
            <span className="material-symbols-outlined">{t.icon}</span><span className="text-xs uppercase tracking-widest">{t.label}</span>
          </button>)}
        </nav>
      </aside>
    </>}

    <nav className="fixed bottom-0 left-0 w-full flex justify-around px-4 pb-6 pt-2 bg-[#111416]/95 backdrop-blur-sm z-50 border-t border-[#42494f]/15 md:hidden">
      {TABS.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setLeague('All');}} className={`flex flex-col items-center pt-2 transition-all btn-press ${tab===t.id?'text-[#abcbda] border-t-2 border-[#abcbda]':'text-[#979fa5]'}`}>
        <span className="material-symbols-outlined mb-1">{t.icon}</span><span className="text-[9px] uppercase tracking-widest">{t.label}</span>
      </button>)}
    </nav>
  </div>;
}

function StatusPill({ok,label,color}){
  const c=color==='blue'?'bg-blue-400':'bg-green-500';
  return <div className="flex items-center gap-1.5 px-2 py-1 bg-[#161a1e] rounded border border-[#42494f]/15">
    <div className={`w-1.5 h-1.5 rounded-full ${ok?c:'bg-[#42494f]'}`}/>
    <span className="text-[9px] font-mono text-[#a6acb3] uppercase tracking-widest">{label}</span>
  </div>;
}
function EmptyState({label}){
  return <div className="text-center py-20 text-[#a6acb3]">
    <span className="material-symbols-outlined block opacity-20 mb-3" style={{fontSize:48}}>sports_score</span>
    <p className="text-sm">{label}</p>
  </div>;
}

function SchemaTab(){
  const tables=[
    {name:'leagues',rows:'6+',cols:[{k:'PK',n:'id',t:'INT'},{k:'',n:'name',t:'VARCHAR(100)'},{k:'',n:'sport',t:'VARCHAR(50)'},{k:'',n:'external_id',t:'VARCHAR(50) UQ'}]},
    {name:'teams',rows:'50+',cols:[{k:'PK',n:'id',t:'INT'},{k:'FK',n:'league_id',t:'-> leagues'},{k:'',n:'name',t:'VARCHAR(100)'},{k:'',n:'logo_url',t:'TEXT'},{k:'',n:'external_id',t:'VARCHAR(100) UQ'}]},
    {name:'matches',rows:'300+',cols:[{k:'PK',n:'id',t:'INT'},{k:'FK',n:'league_id',t:'-> leagues'},{k:'FK',n:'home/away_team_id',t:'-> teams'},{k:'',n:'status',t:'VARCHAR(50)'},{k:'',n:'external_meta',t:'JSON'},{k:'',n:'external_id',t:'VARCHAR(100) UQ'}]},
    {name:'results',rows:'200+',cols:[{k:'PK',n:'id',t:'INT'},{k:'FK',n:'match_id',t:'-> matches UQ'},{k:'',n:'home/away_score',t:'INT'},{k:'FK',n:'winner_team_id',t:'-> teams'}]},
  ];
  return <div className="space-y-4">
    {tables.map(t=><div key={t.name} className="bg-[#111416] rounded-lg border border-[#42494f]/15 overflow-hidden">
      <div className="flex items-center gap-3 p-4 bg-[#161a1e] border-b border-[#42494f]/10">
        <span className="material-symbols-outlined text-[#abcbda]" style={{fontSize:16}}>table_chart</span>
        <code className="text-[#abcbda] font-mono text-sm">{t.name}</code>
        <span className="text-[10px] text-[#70767d] font-mono">{t.rows} rows</span>
      </div>
      <table className="w-full border-collapse">
        <thead><tr><th>Key</th><th>Column</th><th>Type</th></tr></thead>
        <tbody>{t.cols.map((c,i)=><tr key={i}>
          <td><span className={`text-[9px] font-mono px-1.5 py-0.5 rounded ${c.k==='PK'?'bg-[#abcbda]/15 text-[#abcbda]':c.k==='FK'?'bg-[#818cf8]/15 text-[#818cf8]':'text-[#42494f]'}`}>{c.k||'—'}</span></td>
          <td><code className="text-[#e0e6ed] text-xs">{c.n}</code></td>
          <td><span className="text-[11px] text-[#70767d] font-mono">{c.t}</span></td>
        </tr>)}</tbody>
      </table>
    </div>)}
  </div>;
}

function DeployGuide(){
  const [step,setStep]=useState(0);
  const steps=[
    {icon:'dns',title:'Provision Server',desc:'Any Ubuntu 22+ VPS. DigitalOcean, Railway, Render, or local.',cmds:['sudo apt update && sudo apt install -y nodejs npm mysql-server','node -v  # must be >= 18']},
    {icon:'storage',title:'Set Up MySQL',desc:'Create the database and run the schema.',cmds:['sudo mysql -u root','CREATE DATABASE sports_dashboard;','# then: Get-Content schema.sql | mysql -u root -p sports_dashboard']},
    {icon:'key',title:'Configure .env',desc:'Fill in DB credentials and optional API keys.',cmds:['cp .env.example .env','notepad .env','# DB_USER, DB_PASSWORD, DB_NAME required','# CRICAPI_KEY from cricketdata.org (free, for IPL)']},
    {icon:'upload',title:'Start Backend',desc:'Install and run.',cmds:['cd backend','npm install','npm start','# Visit: http://localhost:3001/api/health']},
  ];
  const s=steps[step];
  return <div className="space-y-8 fade-in">
    <div className="flex items-center">
      {steps.map((st,i)=><React.Fragment key={i}>
        <button onClick={()=>setStep(i)} className={`flex flex-col items-center gap-2 px-2 btn-press ${i===step?'opacity-100':'opacity-40 hover:opacity-60'} transition-opacity`}>
          <div className={`w-9 h-9 rounded-full border flex items-center justify-center ${i===step?'bg-[#abcbda]/15 border-[#abcbda] text-[#abcbda]':i<step?'bg-[#abcbda]/8 border-[#abcbda]/30 text-[#abcbda]/60':'border-[#42494f]/30 text-[#a6acb3]'}`}>
            {i<step?<span className="material-symbols-outlined" style={{fontSize:16}}>check</span>:<span className="material-symbols-outlined" style={{fontSize:16}}>{st.icon}</span>}
          </div>
          <span className="text-[8px] uppercase tracking-widest text-[#a6acb3] hidden lg:block text-center max-w-[60px]">{st.title}</span>
        </button>
        {i<steps.length-1&&<div className={`flex-1 h-[1px] ${i<step?'bg-[#abcbda]/40':'bg-[#42494f]/20'}`}/>}
      </React.Fragment>)}
    </div>
    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div className="bg-[#161a1e] rounded-lg p-7 border border-[#42494f]/10 flex flex-col gap-4">
        <div className="w-11 h-11 rounded-full bg-[#abcbda]/10 border border-[#abcbda]/20 flex items-center justify-center"><span className="material-symbols-outlined text-[#abcbda]">{s.icon}</span></div>
        <div>
          <div className="text-[10px] text-[#a6acb3] uppercase tracking-widest mb-1">Step {step+1} of {steps.length}</div>
          <h3 className="font-headline text-xl font-light tracking-tight mb-2" style={{fontFamily:'Manrope'}}>{s.title}</h3>
          <p className="text-sm text-[#a6acb3] leading-relaxed">{s.desc}</p>
        </div>
        <div className="flex gap-3 mt-auto pt-4">
          <button onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0} className="flex-1 py-2.5 rounded border border-[#42494f]/20 text-xs uppercase tracking-widest text-[#a6acb3] hover:border-[#abcbda]/30 transition-all btn-press disabled:opacity-30">Back</button>
          <button onClick={()=>setStep(Math.min(steps.length-1,step+1))} disabled={step===steps.length-1} className="flex-1 py-2.5 rounded bg-[#abcbda]/10 border border-[#abcbda]/30 text-[#abcbda] text-xs uppercase tracking-widest hover:bg-[#abcbda]/20 transition-all btn-press disabled:opacity-30">Next</button>
        </div>
      </div>
      <div className="bg-[#000] rounded-lg border border-[#42494f]/10 overflow-hidden flex flex-col shadow-2xl">
        <div className="flex items-center gap-2 px-4 py-3 bg-[#111416] border-b border-[#42494f]/10">
          <div className="w-2.5 h-2.5 rounded-full bg-red-600/50"/><div className="w-2.5 h-2.5 rounded-full bg-yellow-600/50"/><div className="w-2.5 h-2.5 rounded-full bg-green-600/50"/>
          <span className="ml-2 text-[10px] font-mono text-[#a6acb3] uppercase tracking-tighter">bash — velocity-pro</span>
        </div>
        <div className="p-5 font-mono text-xs text-[#e0e6ed]/80 leading-loose overflow-auto flex-1 max-h-72">
          {s.cmds.map((cmd,i)=><div key={i} className={cmd.startsWith('#')?'text-[#42494f] italic':cmd===''?'h-3':'text-[#abcbda]/90'}>
            {cmd!==''&&!cmd.startsWith('#')&&<span className="text-[#abcbda]/30 select-none mr-2">$</span>}{cmd}
          </div>)}
          <span className="inline-block w-2 h-3.5 bg-[#abcbda]/40 animate-pulse"/>
        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
